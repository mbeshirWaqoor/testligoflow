name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: CI / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate QA state
        shell: bash
        run: |
          state="$(tr -d '\r\n' < qa-state.txt)"
          echo "qa-state=$state"
          test "$state" = "pass"
